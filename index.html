<link rel="stylesheet" href="css/app.css">
<script>
  // Apply language + theme before first paint to avoid a flash.
  try {
    var s = JSON.parse(localStorage.getItem('ahos.settings') || '{}'), d = document.documentElement;
    var l = s.lang || 'ar'; d.lang = l; d.dir = l === 'ar' ? 'rtl' : 'ltr';
    var th = s.theme || 'dark';
    if (th === 'auto') th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    d.dataset.theme = th;
    d.dataset.skin = s.skin || 'lapis'; d.dataset.accent = s.accent || 'gold'; d.dataset.fx = 'off'; d.dataset.bg = s.bg || 'calm';
  } catch (e) {}
</script>
