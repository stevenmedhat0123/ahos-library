name: Build AHOS Library APK

on:
  push:
    paths-ignore: ['**.md', '**.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # If you uploaded the project as one zip file (ahos-library.zip), unpack it; otherwise the repo itself is the project.
      - name: Locate project
        id: proj
        run: |
          if [ -f ahos-library.zip ]; then
            rm -rf _src && mkdir _src && unzip -q ahos-library.zip -d _src
            ROOT=$(dirname "$(find _src -maxdepth 3 -name release.json | head -n 1)")
          else
            ROOT=.
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "project: $ROOT"

      - name: Build signed APK
        id: build
        working-directory: ${{ steps.proj.outputs.root }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          AHOS_SIGNING: ${{ secrets.AHOS_SIGNING }}
          AHOS_SERVER: ${{ vars.AHOS_SERVER }}
        run: bash ci/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ steps.proj.outputs.root }}
        run: |
          FLAGS=""
          if [ "${{ steps.build.outputs.prerelease }}" = "true" ]; then FLAGS="--prerelease"; else FLAGS="--latest"; fi
          gh release create "${{ steps.build.outputs.tag }}" "${{ steps.build.outputs.apk }}" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "${{ steps.build.outputs.title }}" --notes-file dist/notes.md $FLAGS

      - uses: actions/upload-artifact@v4
        with:
          name: AHOS-Library-apk
          path: ${{ steps.proj.outputs.root }}/dist/*.apk
          retention-days: 30
